name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python package
        run: pip install -e ".[dev]"
      - name: Verify agent package import
        run: python -c "from agent.orchestrator import run_demo; print('agent OK')"
      - name: Pytest
        run: pytest tests/ -v --tb=short
      - name: Backend smoke
        run: |
          python -c "from server.http_facade import app; from server.app import mcp; print(app.title, mcp.name)"
      - name: MCP registration smoke
        run: PYTHONPATH=. python scripts/mcp_smoke.py --network
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
